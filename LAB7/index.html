<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>loja</title>
  <style>
 * {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

header{grid-area:header-area;}
main{grid-area:main-area;}
footer{grid-area:footer-area;}

body {
  min-height: 100vh;
  display: grid;
  background-color: #eee;
  grid-template-columns: 1fr;
  grid-template-rows: 95px auto 80px;
  grid-template-areas:
    "header-area"
    "main-area"
    "footer-area";
}

body>*{
  color: white;
}

header{
  background-color: purple;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 15px;
}

header ul{
  display: flex;
  list-style: none;
  gap: 15px;
}

header a{
  color: white;
  text-decoration: none;
}

main{
  padding: 10px;
  text-align: center;
  color: black;
}

footer{
  background-color: purple;
  display: flex;
  align-items: center;
  padding: 15px;
}

section{
  padding: 10px;
  margin: 10px;
}

article{
  background-color: #f4f4f4;
  color: black;
  padding: 10px;
  margin: 10px 0;
  border: 1px solid black;
  border-radius: 10px;
  width: 220px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
}

article img{
  width: 100%;
  height: 160px;
  object-fit: contain;
  display: block;
}

.descricao{
  flex-grow: 1;
  font-size: 13px;
  font-style: italic;
}

div{
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 15px;
}

button{
  padding: 4px 10px;
  cursor: pointer;
}

h2{
  margin: 20px 0 30px;
}

#total{
  color: black;
  font-weight: bold;
  font-size: 20px;
  margin-top:30px;
  margin-bottom:20px;
}

/* só mostra uma secção de cada vez */
body.produtos #cesto,
body.cesto #produtos{
  display: none;
}

/* cesto com fundo magenta */
body.cesto{
  background: linear-gradient(purple, magenta);
}
body.cesto main,
body.cesto #total{
  color: white;
}
  </style>
</head>
</head>
<body>
  <header>
    <h1>Loja</h1>
    <nav>
      <ul>
        <li><a href="#produtos">Produtos</a></li>
        <li><a href="#cesto">Cesto</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section id="produtos">
      <h2>Selecione os seus Produtos</h2>
      <div></div>
    </section>
    <section id="cesto">
      <h2>Produtos Selecionados</h2>
      <div></div>
      <p id="total"></p>
    </section>
  </main>
  <footer></footer>

  <script src="produtos.js"></script>
  <script src="main.js"></script>
</body>
</html>
